aid: m2p-fintech
name: M2P Fintech
description: >-
  M2P Fintech is Asia's largest API infrastructure company, powering banking, lending, and payment
  solutions for fintechs, banks, NBFCs, and enterprises. Founded in 2014 and headquartered in Chennai,
  India, M2P operates across 30+ countries and processes 20+ billion transactions for 50+ million end
  customers. Its modular, cloud-native, API-first product suite lets businesses embed financial services
  — core banking (Turing CBS), card issuance (credit, debit, prepaid, forex), UPI, cross-border payments,
  loan origination and management (Finflux), merchant management, BNPL, microfinance, KYC (Syntizen),
  reconciliation (Recon360), fraud and AML monitoring, 3DS access control, and neobanking — with up to
  5X faster go-to-market.
